services:
  whatsapp-assistant:
    build: .
    container_name: whatsapp-assistant
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Asia/Jakarta
    ports:
      # Endpoint OwnTracks (HTTP_PORT di .env). Taruh reverse proxy (nginx/caddy) dengan
      # HTTPS di depan ini kalau diakses dari luar jaringan lokal.
      - "3009:3009"
    volumes:
      - ./auth_session:/app/auth_session
      - ./data:/app/data
      - ./Download:/app/Download
      # Monitor baterai server: biarkan container membaca baterai laptop host (read-only)
      - /sys/class/power_supply:/sys/class/power_supply:ro
    extra_hosts:
      # Supaya container bisa akses Ollama yang jalan di host (Linux perlu ini secara eksplisit)
      - "host.docker.internal:host-gateway"
    # QR code login perlu dilihat di terminal saat first-run
    stdin_open: true
    tty: true
